name: Build slim data

# Put this file at:  .github/workflows/build-data.yml
# Runs whenever a raw board JSON (or build_data.py) is pushed, and writes the small
# data/ files that the website loads instead of the 20 MB originals.
on:
  push:
    branches: [main]
    paths:
      - 'data.json'
      - 'business-data.json'
      - 'humanities-data.json'
      - 'hsc26-*-data.json'
      - 'build_data.py'
      - '.github/workflows/build-data.yml'
  workflow_dispatch:

permissions:
  contents: write

# build-data and sitemap both push to main; run them one at a time so a push never gets rejected
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data
        run: python3 build_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update slim data"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && exit 0
              echo "push failed (try $i), retrying..."; sleep 6
            done
            exit 1
          fi
