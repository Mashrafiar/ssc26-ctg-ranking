name: Generate Sitemap

# Put this file at:  .github/workflows/sitemap.yml   (replaces the old one)
on:
  push:
    branches:
      - main
    paths:
      - '*.json'
      - '*.html'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

# build-data and sitemap both push to main; run them one at a time so a push never gets rejected
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate sitemap
        run: |
          python3 - <<'PY'
          import datetime, glob, html, json, os
          from pathlib import Path

          BASE = "https://mashrafiar.github.io/ssc26-ctg-ranking/"
          MAX_URLS = 40000   # Google limit is 50,000 URLs per sitemap file

          # Normal pages (only added when the file exists)
          PAGES = [
              "", "ssc.html", "hsc.html",
              "science.html", "business.html", "humanities.html",
              "hsc-science.html", "hsc-business.html", "hsc-humanities.html",
          ]

          # (data file, details page): one URL per student is added for each existing pair
          DATASETS = [
              ("data.json",                  "science-details.html"),
              ("business-data.json",         "business-details.html"),
              ("humanities-data.json",       "humanities-details.html"),
              ("hsc26-science-data.json",    "hsc-science-details.html"),
              ("hsc26-business-data.json",   "hsc-business-details.html"),
              ("hsc26-humanities-data.json", "hsc-humanities-details.html"),
          ]

          urls = []
          for p in PAGES:
              if p == "" or os.path.exists(p):
                  urls.append(BASE + p)

          for data_file, details_page in DATASETS:
              if not (os.path.exists(data_file) and os.path.exists(details_page)):
                  continue
              with open(data_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
              count = 0
              for student in data:
                  # SSC files use "rl" / "Roll"; HSC files use "Roll No"
                  roll = student.get("rl") or student.get("Roll") or student.get("Roll No")
                  if roll is not None and str(roll).strip():
                      urls.append(BASE + details_page + "?roll=" + str(roll).strip())
                      count += 1
              print(f"{data_file}: {count} students")

          urls = list(dict.fromkeys(urls))   # remove duplicates, keep order

          # remove old generated files so a smaller dataset never leaves stale entries
          for old in glob.glob("sitemap*.xml"):
              os.remove(old)

          today = datetime.date.today().isoformat()
          chunks = [urls[i:i + MAX_URLS] for i in range(0, len(urls), MAX_URLS)]
          index = ['<?xml version="1.0" encoding="UTF-8"?>',
                   '<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']

          for n, chunk in enumerate(chunks, start=1):
              name = f"sitemap-{n}.xml"
              lines = ['<?xml version="1.0" encoding="UTF-8"?>',
                       '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
              for u in chunk:
                  lines.append(f"  <url><loc>{html.escape(u)}</loc></url>")
              lines.append("</urlset>")
              Path(name).write_text("\n".join(lines), encoding="utf-8")
              index.append(f"  <sitemap><loc>{BASE}{name}</loc><lastmod>{today}</lastmod></sitemap>")

          index.append("</sitemapindex>")
          Path("sitemap.xml").write_text("\n".join(index), encoding="utf-8")
          print(f"Generated {len(urls)} URLs in {len(chunks)} sitemap file(s)")
          PY

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- 'sitemap*.xml'

          if git diff --cached --quiet; then
            echo "No sitemap changes."
          else
            git commit -m "Update sitemap"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && exit 0
              echo "push failed (try $i), retrying..."; sleep 6
            done
            exit 1
          fi
