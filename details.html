<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Details</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f8fafc; }
    .card { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .back-btn { display: inline-block; padding: 8px 16px; background: #64748b; color: white; border-radius: 6px; text-decoration: none; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 25px; }
    .item { background: #f1f5f9; padding: 10px; border-radius: 6px; }
    .item label { display: block; font-size: 12px; color: #64748b; }
    .item span { font-weight: bold; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; }
    th { background-color: #0f172a; color: white; }
    .na-text { color: #dc2626; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <a href="index.html" class="back-btn">&larr; ফিরে যান</a>
    <h2 id="sName"></h2>

    <div class="grid">
      <div class="item"><label>Roll</label><span id="sRoll"></span></div>
      <div class="item"><label>Registration No</label><span id="sReg"></span></div>
      <div class="item"><label>Board</label><span id="sBoard"></span></div>
      <div class="item"><label>Group</label><span id="sGroup"></span></div>
      <div class="item"><label>Session</label><span id="sSession"></span></div>
      <div class="item"><label>Type</label><span id="sRegular"></span></div>
      <div class="item"><label>Father's Name</label><span id="sFather"></span></div>
      <div class="item"><label>Mother's Name</label><span id="sMother"></span></div>
      <div class="item"><label>Date of Birth</label><span id="sDob"></span></div>
      <div class="item"><label>GPA</label><span id="sGpa"></span></div>
    </div>

    <h3>Subject Wise Marks</h3>
    <table>
      <thead>
        <tr>
          <th>Subject Name</th>
          <th>Marks</th>
        </tr>
      </thead>
      <tbody id="subTable"></tbody>
    </table>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const roll = params.get('roll');

    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        const student = data.find(s => s.rl === roll);
        if (student) {
          document.getElementById('sName').innerText = student.nm;
          document.getElementById('sRoll').innerText = student.rl;
          document.getElementById('sReg').innerText = student.rg;
          document.getElementById('sBoard').innerText = student.bd;
          document.getElementById('sGroup').innerText = student.gp_grp;
          document.getElementById('sSession').innerText = student.ss;
          document.getElementById('sRegular').innerText = student.tp;
          document.getElementById('sFather').innerText = student.fn;
          document.getElementById('sMother').innerText = student.mn;
          document.getElementById('sDob').innerText = student.db;
          document.getElementById('sGpa').innerText = student.gp;

          const tbody = document.getElementById('subTable');
          for (const [subName, mark] of Object.entries(student.sb)) {
            const row = `<tr>
              <td>${subName}</td>
              <td class="${mark === 'N/A' ? 'na-text' : ''}">${mark}</td>
            </tr>`;
            tbody.innerHTML += row;
          }
        }
      });
  </script>
</body>
      </html>
