<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Details</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .back-btn {
      display: inline-block;
      padding: 8px 16px;
      background: #64748b;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 25px;
    }
    .item {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 6px;
    }
    .item label {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 3px;
    }
    .item span { font-weight: bold; font-size: 15px; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      min-width: 500px;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #cbd5e1;
      padding: 10px;
      text-align: left;
    }
    th { background: #0f172a; color: white; }
    .na-text { color: #dc2626; font-weight: bold; }
    .message {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <a href="index.html" class="back-btn">&larr; ফিরে যান</a>
    <h2 id="sName">Loading...</h2>

    <div class="grid">
      <div class="item"><label>Roll</label><span id="sRoll"></span></div>
      <div class="item"><label>Registration No</label><span id="sReg"></span></div>
      <div class="item"><label>Board</label><span id="sBoard"></span></div>
      <div class="item"><label>Group</label><span id="sGroup"></span></div>
      <div class="item"><label>Session</label><span id="sSession"></span></div>
      <div class="item"><label>Type</label><span id="sRegular"></span></div>
      <div class="item"><label>Father's Name</label><span id="sFather"></span></div>
      <div class="item"><label>Mother's Name</label><span id="sMother"></span></div>
      <div class="item"><label>Date of Birth</label><span id="sDob"></span></div>
      <div class="item"><label>GPA</label><span id="sGpa"></span></div>
      <div class="item"><label>Total Marks</label><span id="sTotal"></span></div>
      <div class="item"><label>Result</label><span id="sResult"></span></div>
    </div>

    <h3>Subject Wise Marks</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Subject Name</th>
            <th>Marks</th>
          </tr>
        </thead>
        <tbody id="subTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const requestedRoll = params.get('roll');

    const fields = {
      sName: ['nm', 'Name'],
      sRoll: ['rl', 'Roll'],
      sReg: ['rg', 'Reg. NO'],
      sBoard: ['bd', 'Board'],
      sGroup: ['gp_grp', 'Group'],
      sSession: ['ss', 'Session'],
      sRegular: ['tp', 'Type'],
      sFather: ['fn', "Father's Name"],
      sMother: ['mn', "Mother's Name"],
      sDob: ['db', 'Date of Birth'],
      sGpa: ['gp', 'GPA'],
      sTotal: ['tm', 'Total Marks'],
      sResult: ['rs', 'Result']
    };

    function getValue(student, shortName, fullName = '') {
      if (student[shortName] !== undefined && student[shortName] !== null) {
        return String(student[shortName]);
      }
      if (fullName && student[fullName] !== undefined && student[fullName] !== null) {
        return String(student[fullName]);
      }
      return '';
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value || 'N/A';
    }

    fetch('data.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('data.json could not be loaded.');
        }
        return response.json();
      })
      .then(data => {
        const student = data.find(s =>
          getValue(s, 'rl', 'Roll') === String(requestedRoll)
        );

        if (!student) {
          document.getElementById('sName').textContent = 'Student পাওয়া যায়নি';
          document.getElementById('subTable').innerHTML =
            '<tr><td colspan="2" class="message">এই Roll-এর কোনো student পাওয়া যায়নি।</td></tr>';
          return;
        }

        for (const [id, [shortName, fullName]] of Object.entries(fields)) {
          setText(id, getValue(student, shortName, fullName));
        }

        const subjects = student.sb || student['Subject Wise Marks'] || {};
        const tbody = document.getElementById('subTable');
        const fragment = document.createDocumentFragment();

        for (const [subjectName, mark] of Object.entries(subjects)) {
          const row = document.createElement('tr');

          const subjectCell = document.createElement('td');
          subjectCell.textContent = subjectName;

          const markCell = document.createElement('td');
          markCell.textContent = String(mark);
          if (String(mark).toUpperCase() === 'N/A') {
            markCell.className = 'na-text';
          }

          row.append(subjectCell, markCell);
          fragment.appendChild(row);
        }

        tbody.replaceChildren(fragment);
      })
      .catch(error => {
        console.error(error);
        document.getElementById('sName').textContent = 'Data load করতে সমস্যা হয়েছে';
      });
  </script>

</body>
</html>
