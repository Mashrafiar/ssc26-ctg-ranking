<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Result & Ranking | SSC26 CTG</title>
<meta name="description" content="SSC26 CTG school-wise result, GPA analytics and student ranking.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#071a3a;--blue:#2166e5;--cyan:#45d3ff;--ink:#0b1730;--muted:#64748b;--line:#e6edf5;--soft:#f5f8fc}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,"Noto Sans Bengali",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(69,211,255,.1),transparent 30%),radial-gradient(circle at 90% 10%,rgba(33,102,229,.1),transparent 30%),var(--soft);-webkit-font-smoothing:antialiased}.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#06142f,#071a3a 55%,#0b326c);padding:28px 22px 82px}.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.1);border-radius:50%;pointer-events:none}.hero:before{width:360px;height:360px;right:-130px;top:-190px}.hero:after{width:230px;height:230px;left:-120px;bottom:-150px}.hero-inner{position:relative;z-index:1;max-width:1180px;margin:auto}.back{display:inline-flex;padding:9px 13px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);font-size:12px}.eyebrow{margin-top:45px;color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{max-width:900px;margin:10px 0 0;font-size:clamp(32px,5vw,62px);line-height:1.02;letter-spacing:-.05em}.hero p{max-width:720px;color:rgba(255,255,255,.68);line-height:1.7}.wrap{max-width:1180px;margin:-45px auto 0;padding:0 22px 60px;position:relative;z-index:2}.panel{border:1px solid rgba(219,228,240,.9);border-radius:24px;background:rgba(255,255,255,.8);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(4,22,52,.13);overflow:hidden}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#fff,#f8fafc)}.label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.07em}.value{margin-top:5px;font-size:24px;font-weight:800}.gpa{padding:0 20px 20px}.gpa-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.g{padding:13px;border:1px solid var(--line);border-radius:15px;text-align:center}.g strong{display:block;font-size:17px}.g span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.table-wrap{overflow:auto;padding:0 20px 25px}.section-title{padding:0 20px;margin:4px 0 13px;font-size:17px}.search{margin:0 20px 16px;width:calc(100% - 40px);height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fff}.search:focus{border-color:#8eb8ff;box-shadow:0 0 0 4px rgba(33,102,229,.08)}table{width:100%;min-width:760px;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #eef2f6;font-size:13px}th{position:sticky;top:0;background:#f8fafc;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}tbody tr:hover td{background:#fbfdff}.rank{font-weight:800}.board{color:#60708a;font-weight:700}.name{font-weight:700}.marks{font-weight:700}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.gpa-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.hero{padding-bottom:70px}.wrap{padding:0 12px 40px}.stats{padding:12px}.gpa{padding:0 12px 12px}.table-wrap{padding:0 12px 18px}.section-title{padding:0 12px}.search{margin-left:12px;width:calc(100% - 24px)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><a class="back" id="backLink" href="index.html">← Back to Ranking</a><div class="eyebrow">SSC26 CTG • School Result</div><h1 id="schoolName">Loading school…</h1><p id="subtitle">School performance, GPA distribution and student ranking.</p></div></header>
<main class="wrap"><section class="panel"><div class="stats" id="stats"></div><div class="gpa"><h2 class="section-title">GPA Analytics</h2><div class="gpa-grid" id="gpaGrid"></div></div><h2 class="section-title">School Student Ranking</h2><input id="studentSearch" class="search" placeholder="Search student by name or roll…"><div class="table-wrap"><table><thead><tr><th>School Rank</th><th>Board Rank</th><th>Roll</th><th>Student</th><th>GPA</th><th>Total Marks</th></tr></thead><tbody id="body"></tbody></table><div id="empty" class="empty" hidden>No students found.</div></div></section></main>
<script>
const params=new URLSearchParams(location.search);const group=params.get('group')||'data.json';const schoolName=params.get('school')||'';const config={
 'data.json':{data:'data.json',back:'science.html',label:'Science'},
 'business-data.json':{data:'business-data.json',back:'business.html',label:'Business Studies'},
 'humanities-data.json':{data:'humanities-data.json',back:'humanities.html',label:'Humanities'}
}[group]||{data:'data.json',back:'science.html',label:'Science'};
document.getElementById('backLink').href=config.back;
const body=document.getElementById('body'),search=document.getElementById('studentSearch');let students=[];
function val(s,a,b=''){if(s[a]!==undefined&&s[a]!==null)return String(s[a]);if(b&&s[b]!==undefined&&s[b]!==null)return String(s[b]);return ''}
function marks(s){const x=Number(val(s,'tm','Total Marks'));if(Number.isFinite(x))return x;const sb=s.sb||s['Subject Wise Marks']||{};let t=0;for(const v of Object.values(sb)){const n=Number(v);if(Number.isFinite(n))t+=n}return t}
function gcat(s){const g=Number(val(s,'gp','GPA'));if(!Number.isFinite(g)||g===0)return'Fail';if(g===5)return'5';if(g>=4)return'4';if(g>=3)return'3';if(g>=2)return'2';if(g>=1)return'1';return'Fail'}
function esc(x){return String(x).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function render(){const q=search.value.trim().toLowerCase();const arr=students.filter(s=>!q||val(s,'nm','Name').toLowerCase().includes(q)||val(s,'rl','Roll').toLowerCase().includes(q));body.innerHTML=arr.map((s,i)=>`<tr><td class="rank">${i+1}</td><td class="board">#${esc(val(s,'rk','Rank')||'—')}</td><td>${esc(val(s,'rl','Roll')||'—')}</td><td class="name">${esc(val(s,'nm','Name')||'Unknown')}</td><td>${esc(val(s,'gp','GPA')||'—')}</td><td class="marks">${esc(marks(s)||'—')}</td></tr>`).join('');document.getElementById('empty').hidden=arr.length>0}
fetch(config.data).then(r=>r.json()).then(data=>{const all=data.filter(s=>val(s,'inst','Institute').trim()===schoolName.trim()).sort((a,b)=>(Number(val(a,'rk','Rank'))||Infinity)-(Number(val(b,'rk','Rank'))||Infinity));students=all;document.getElementById('schoolName').textContent=schoolName||'School Result';document.getElementById('subtitle').textContent=`${config.label} • ${all.length.toLocaleString()} students • School-wise performance & ranking`;
const counts={'5':0,'4':0,'3':0,'2':0,'1':0,'Fail':0};let sum=0,n=0,best=Infinity;all.forEach(s=>{const c=gcat(s);counts[c]++;const g=Number(val(s,'gp','GPA'));if(Number.isFinite(g)){sum+=g;n++}const r=Number(val(s,'rk','Rank'));if(Number.isFinite(r)&&r>0)best=Math.min(best,r)});const fail=counts.Fail,pass=all.length-fail,avg=n?sum/n:null,rate=all.length?pass/all.length*100:0;document.getElementById('stats').innerHTML=`<div class="stat"><div class="label">Students</div><div class="value">${all.length.toLocaleString()}</div></div><div class="stat"><div class="label">Average GPA</div><div class="value">${avg===null?'—':avg.toFixed(2)}</div></div><div class="stat"><div class="label">Best Board Rank</div><div class="value">${Number.isFinite(best)?'#'+best.toLocaleString():'—'}</div></div><div class="stat"><div class="label">Pass Rate</div><div class="value">${rate.toFixed(1)}%</div></div>`;document.getElementById('gpaGrid').innerHTML=['5','4','3','2','1','Fail'].map(c=>`<div class="g"><strong>GPA ${c}</strong><span>${counts[c].toLocaleString()} • ${all.length?(counts[c]/all.length*100).toFixed(1):'0.0'}%</span></div>`).join('');render()}).catch(e=>{document.getElementById('schoolName').textContent='Unable to load school result';document.getElementById('subtitle').textContent=e.message});
search.addEventListener('input',render);
</script>
</body></html>
